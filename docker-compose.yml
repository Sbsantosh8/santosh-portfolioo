version: '3'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: unified-backend
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - IMAP_SERVER=imap.gmail.com
      - IMAP_PORT=993
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: unified-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
    restart: unless-stopped
